name: Tests
# Перевірки коду без публікацій: ruff + pytest (усі зовнішні виклики в тестах підмінено).
# Секрети не використовуються. Запускається на кожен PR і вручну.

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Ruff
      run: ruff check .
    - name: Pytest
      run: pytest -q
