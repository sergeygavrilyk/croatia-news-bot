name: Croatia News Automator

on:
  schedule:
    # Кожну годину з 07:00 до 16:00 UTC (це 09:00-18:00 за місцевим часом)
    - cron: '0 7-16 * * *'
    # Один запуск о 19:00 UTC (це 21:00 за місцевим часом)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 1. Автоматично обираємо staging (для develop) або production (для main)
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    # 2. Надаємо права на збереження історії та беклогу в репозиторій
    permissions:
      contents: write 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      run: python news_bot.py

    - name: Commit and push history and backlog state
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Створюємо файли стану, якщо вони ще не існують
        touch posted_news.txt posted_titles.txt news_backlog.json
        
        # Додаємо всі файли стану (історію та чергу)
        git add posted_news.txt posted_titles.txt news_backlog.json
        
        # Зберігаємо зміни тільки якщо є нові дані
        if ! git diff --staged --quiet; then
          git commit -m "Update news history and backlog state [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
        else
          echo "No changes in backlog or history to commit."
        fi