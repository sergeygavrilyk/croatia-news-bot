name: Croatia News Automator
run-name: ${{ inputs.weekly_report && '📅 Тижневий звіт' || (inputs.dry_run && '🧪 DRY RUN (тестовий запуск)' || 'Croatia News Automator') }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовий запуск: пости — в адмін-чат з позначкою ТЕСТ, файли стану не змінюються"
        type: boolean
        default: false
      weekly_report:
        description: "Лише тижневий звіт адміну (без новин і публікацій, стан не змінюється)"
        type: boolean
        default: false

# Лише один запуск бота одночасно: наступний чекає, поки завершиться попередній
# (інакше два процеси публікують з однаковим беклогом і конфліктують при git push).
concurrency:
  group: croatia-news-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    permissions:
      contents: write 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        

    - name: Run News Bot
      id: bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        DRY_RUN: ${{ inputs.dry_run }}
        # Каскади моделей Gemini (T-04): Settings -> Secrets and variables -> Actions -> Variables.
        # Якщо змінну не створено — беруться значення за замовчуванням з news_bot.py.
        GEMINI_FILTER_MODELS: ${{ vars.GEMINI_FILTER_MODELS }}
        GEMINI_TRANSLATE_MODELS: ${{ vars.GEMINI_TRANSLATE_MODELS }}
      run: python news_bot.py ${{ inputs.weekly_report && '--weekly-report' || '' }}

    - name: Commit and push history and backlog state
      # Зберігаємо стан навіть якщо бот завершився з помилкою: пости, які вже вийшли,
      # мають потрапити в історію, інакше наступний запуск опублікує їх повторно.
      # У тестовому запуску (DRY_RUN) нічого не комітимо.
      if: ${{ always() && steps.bot.outcome != 'skipped' && !inputs.dry_run && !inputs.weekly_report }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        touch posted_news.txt posted_titles.txt news_backlog.json analytics.json rejected_news.json
        
        git add posted_news.txt posted_titles.txt news_backlog.json analytics.json rejected_news.json
        
        if ! git diff --staged --quiet; then
          git commit -m "Update news history and backlog state [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
        else
          echo "No changes in backlog or history to commit."
        fi
