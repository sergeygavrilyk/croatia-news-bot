line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W"]
# E501 — довгі рядки (тексти промптів).
# W291/W293 — пробіли в кінці рядків є всередині текстів промптів, які не можна змінювати
# без погодження власника (AI_RULES §2.1), тому ці правила вимкнено.
ignore = ["E501", "W291", "W293"]
